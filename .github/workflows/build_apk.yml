name: Build CNAS Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Generate Android Platform wrapper
        working-directory: cnas/mobile
        run: flutter create . --platforms=android --org com.cbi.cnas --project-name cnas_mobile

      - name: Install dependencies
        working-directory: cnas/mobile
        run: flutter pub get

      - name: Build APK
        working-directory: cnas/mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cnas-cbi-intelligence-app
          path: cnas/mobile/build/app/outputs/flutter-apk/app-release.apk
